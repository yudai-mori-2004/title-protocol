[package]
name = "title-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Title Protocol Solana Extension (Ed25519 signing, cNFT mint, whitelist PDA)"

[dependencies]
title-core = { workspace = true }
title-attestation = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
serde_json_canonicalizer = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
solana-sdk = "2.2"
# mpl-bubblegum 2.1 is the V2 ABI we target; the field shape on
# MetadataArgsV2 changed in 2.1 so don't allow auto-upgrade across 2.x.
mpl-bubblegum = "~2.1"
rand = "0.8"
bincode = "1.3"

[dev-dependencies]
solana-client = "2.2"
title-attestation = { workspace = true, features = ["mock"] }
title-attestation-aws-nitro = { workspace = true }
