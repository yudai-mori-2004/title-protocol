[workspace]
members = [
    "crates/attestation",
    "crates/attestation-aws-nitro",
    "crates/core",
    "crates/crypto",
    "crates/tee",
    "crates/gateway",
    "crates/proxy",
    "crates/solana",
    "crates/cli",
]
exclude = [
    "legacy",
    "programs",
    "sp1-guests",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yudai-mori-2004/title-protocol"
authors = ["Title Protocol Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Exact pin: `reader.json()` output is not byte-stable across c2pa-rs versions
# (key ordering, optional fields, encoding choices). The TEE attestation seals
# the processor output via JCS hash, so a silent minor-version bump invalidates
# attestation comparability. Bump intentionally and bump PCR0 with it.
c2pa = "=0.84.1"
sha2 = "0.10"
hex = "0.4"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json_canonicalizer = "0.2"
base64 = "0.22"

# Workspace-internal crate references
title-attestation = { path = "crates/attestation" }
title-attestation-aws-nitro = { path = "crates/attestation-aws-nitro" }
title-core = { path = "crates/core" }
title-tee = { path = "crates/tee" }
title-crypto = { path = "crates/crypto" }
title-gateway = { path = "crates/gateway" }
title-proxy = { path = "crates/proxy" }
title-solana = { path = "crates/solana" }

[profile.release]
overflow-checks = true
codegen-units = 1
lto = "fat"
strip = "symbols"
