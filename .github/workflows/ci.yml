name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  workspace:
    name: workspace check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --features title-tee/runtime-mock
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
      - name: forbid close= in whitelist program
        # register_key の init guard を壊す `#[account(close = ...)]` 属性が
        # 入っていないか検出。仕様 §6.2 の取消設計 (revoke はフラグのみ、
        # PDA close 禁止) を構造的に強制する。
        run: |
          if grep -nE '#\[account\([^)]*close[[:space:]]*=' programs/title-whitelist/src/lib.rs; then
            echo "::error::register_key の init guard を壊す close= 属性が追加された (Spec §6.2 取消設計)" >&2
            exit 1
          fi

  proxy:
    name: proxy (default + vendor-aws on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p title-proxy
      - run: cargo check -p title-proxy --features vendor-aws

  attestation-aws-nitro-fixture:
    name: attestation-aws-nitro (real fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p title-attestation-aws-nitro -- --include-ignored
