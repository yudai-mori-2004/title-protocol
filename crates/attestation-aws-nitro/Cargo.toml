[package]
name = "title-attestation-aws-nitro"
description = "AWS Nitro Enclave Attestation Document verifier — implements title-attestation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Enable SP1 zkVM precompiles. Used by the SP1 guest crate that re-exports
# this crate's logic; not for production host builds.
sp1 = ["dep:p256_sp1", "dep:sha2_sp1"]

[dependencies]
title-attestation = { workspace = true }

# X.509 certificate parsing (also exposes Oid + DER parser used for curve OIDs)
x509-parser = "0.16"

# ECDSA signature verification (RustCrypto)
p384 = "0.13"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }

# SP1 precompile-accelerated variants (feature-gated)
p256_sp1 = { git = "https://github.com/sp1-patches/elliptic-curves", rev = "patch-p256-13.2-sp1-5.0.0", package = "p256", optional = true }

# SHA-256 / SHA-384
sha2 = "0.10"
# Pin to commit hash, not branch — branch tip drifts on every upstream
# push and would silently change the SP1 vkey if cargo refreshed it.
sha2_sp1 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", rev = "1f224388fdede7cef649bce0d63876d1a9e3f515", package = "sha2", optional = true }

# CBOR (COSE_Sign1 + Attestation Document payload)
serde_cbor = "0.11"
serde = { workspace = true }
serde_bytes = "0.11"
serde_with = "3"

# Error handling (internal use only — public API surfaces AttestationError)
anyhow = "1"
