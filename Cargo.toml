[workspace]
members = [
    "crates/core",
    "crates/crypto",
    "crates/tee",
    "crates/gateway",
]
exclude = [
    "sandbox",
    "legacy",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yudai-mori-2004/title-protocol"
authors = ["Title Protocol Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
c2pa = "0.84"
sha2 = "0.10"
hex = "0.4"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json_canonicalizer = "0.2"
base64 = "0.22"

# Workspace-internal crate references
title-core = { path = "crates/core" }
title-tee = { path = "crates/tee" }
title-crypto = { path = "crates/crypto" }
title-gateway = { path = "crates/gateway" }

[profile.release]
overflow-checks = true
