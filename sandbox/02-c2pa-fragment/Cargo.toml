[package]
name = "c2pa_fragment"
version = "0.1.0"
edition = "2021"

[dependencies]
# C2PA verification + signing (file_io for sign_fragmented_files)
c2pa = { version = "0.84", features = ["file_io"] }

# Crypto (manifest JSON hash comparison)
sha2 = "0.10"
hex = "0.4"

# Serialization
serde_json = "1"
