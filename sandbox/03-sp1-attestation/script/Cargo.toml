[package]
name = "attestation-script"
version = "0.1.0"
edition = "2021"

[dependencies]
# SP1 SDK（ホスト側: proof 生成・検証）
sp1-sdk = "6.2"

# 非同期ランタイム（SP1 v6 API は async）
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# SHA-256（ホスト側でのハッシュ検証）
sha2 = "0.10"
hex = "0.4"

# Attestation Document のパース（ホスト側で期待値を計算）
serde_cbor = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"

[build-dependencies]
# Guest プログラムのビルド
sp1-build = "6.2"
