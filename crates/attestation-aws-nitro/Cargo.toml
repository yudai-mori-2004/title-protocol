[package]
name = "title-attestation-aws-nitro"
description = "AWS Nitro Enclave Attestation Document verifier — implements title-attestation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Enable SP1 zkVM precompiles. Used by the SP1 guest crate that re-exports
# this crate's logic; not for production host builds.
sp1 = ["dep:p256_sp1", "dep:sha2_sp1"]

[dependencies]
title-attestation = { workspace = true }

# X.509 certificate parsing
x509-parser = "0.16"

# ECDSA signature verification (RustCrypto)
p384 = "0.13"
p256 = "0.13"

# SP1 precompile-accelerated variants (feature-gated)
p256_sp1 = { git = "https://github.com/sp1-patches/elliptic-curves", rev = "patch-p256-13.2-sp1-5.0.0", package = "p256", optional = true }

# RSA signature verification (for non-Nitro cert chains that may appear)
rsa = "0.9"

# SHA-256 / SHA-384
sha2 = { version = "0.10", features = ["oid"] }
sha2_sp1 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", branch = "patch-sha2-v0.10.8", package = "sha2", features = ["oid"], optional = true }

# OID parsing
oid = "0.2"

# CBOR (COSE_Sign1 + Attestation Document payload)
serde_cbor = "0.11"
serde = { workspace = true }
serde_bytes = "0.11"
serde_with = "3"

# Error handling (internal use only — public API surfaces AttestationError)
anyhow = "1"
