[package]
name = "title-proxy"
description = "Title Protocol — HTTP forwarder between Nitro Enclave and the open internet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "title-proxy"
path = "src/main.rs"

[features]
default = ["vendor-aws"]
# Listen on a vsock socket (AWS Nitro Enclaves host side). Disable in
# dev/CI where vsock is not available — falls back to a TCP listener.
vendor-aws = ["dep:vsock"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
vsock = { version = "0.5", optional = true }

[dev-dependencies]
axum = "0.8"
