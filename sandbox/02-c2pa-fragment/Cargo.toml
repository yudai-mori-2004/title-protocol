[package]
name = "c2pa_fragment"
version = "0.1.0"
edition = "2021"

[dependencies]
# C2PA verification + signing (file_io for sign_fragmented_files)
c2pa = { version = "0.84", features = ["file_io"] }

# Crypto
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# File system
glob = "0.3"
tempfile = "3"
